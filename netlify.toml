# Netlify build settings for the Brothers. site (Git-based deploy).
# The repo root is this folder, so no "base" is needed.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The contract signing endpoints. Plain functions alongside the static
# build - no Astro adapter, so the existing Netlify Forms detection
# (which scans the static HTML in dist at deploy time) keeps working.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Nice-to-have security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Long-cache the fingerprinted/static image + font assets
[[headers]]
  for = "/gallery/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/hero/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/logo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Astro emits sitemap-index.xml, but /sitemap.xml is the address most crawlers
# and tools try first - serve it as an alias instead of a 404.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 200

# The signed-contract page. Never indexed, never cached, never referred from.
# The header is the layer that actually binds: it applies to the HTTP response
# whether or not a crawler parses the HTML.
[[headers]]
  for = "/contract/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

# The admin page, same treatment as /contract/. Two rules because the bare
# "/admin" request is not matched by "/admin/*".
# A <meta name="robots"> tag only helps a crawler that fetched the HTML and
# parsed it; the header is the layer that binds, because it rides on every
# response - the HTML, a 302 to the login form, an asset, a bot that reads
# headers only - and it is what keeps the admin URL out of a shared cache or
# a Referer header on the way to anywhere else.
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
